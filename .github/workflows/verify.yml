name: Verify (fork only)

on:
  push:
    branches: [verify, verify-business, baseline]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Regenerate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          git status --short JOEYY.xcodeproj
      - uses: actions/upload-artifact@v4
        with:
          name: xcodeproj
          path: JOEYY.xcodeproj/project.pbxproj
      - name: Choose an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          set +e
          xcodebuild test -project JOEYY.xcodeproj -scheme JOEYY \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult -only-testing:JOEYYUITests/MerchantFlowTests >  xcodebuild.log 2>&1
          status=$?
          grep -E "AUDIT|error:|warning: .*(Swift|concurr)|Test Case .* failed|Executed|\*\* TEST|\*\* BUILD" xcodebuild.log | tail -150
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log